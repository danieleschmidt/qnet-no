# Secret for QNet-NO sensitive configuration
# IMPORTANT: Replace these placeholders with actual base64-encoded values
# Use: echo -n "your_value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: qnet-no-secret
  namespace: qnet-no
type: Opaque
data:
  # Replace with actual base64 encoded values - do not commit real secrets
  POSTGRES_USER: ${POSTGRES_USER_B64:-cW5ldA==}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_B64:-REPLACE_WITH_ACTUAL_VALUE}
  REDIS_PASSWORD: ${REDIS_PASSWORD_B64:-}
  JWT_SECRET: ${JWT_SECRET_B64:-REPLACE_WITH_ACTUAL_VALUE}